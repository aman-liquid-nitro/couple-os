# ============================================================================
# Couple OS — local development stack
#
#   docker compose up -d       api + database + mail catcher, three containers
#   docker compose up -d db    the database alone, for the SQL RLS harnesses
#
# The database initialises itself from data/schema.sql on first start only.
# To re-apply a changed schema:  docker compose down -v && docker compose up -d
# ============================================================================

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: coupleos-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coupleos}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
      # Consumed by 02-app-role.sh to create the non-superuser role the
      # application connects as. RLS is bypassed by superusers, so the
      # application must never connect as postgres (ADR 0005).
      APP_DB_USER: ${APP_DB_USER:-app_user}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-dev_app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - coupleos-pgdata:/var/lib/postgresql/data
      # Run in filename order on first start, against POSTGRES_DB.
      - ./data/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./data/docker-init-app-role.sh:/docker-entrypoint-initdb.d/02-app-role.sh:ro
      # The RLS harnesses, so they can be run inside the container without
      # psql or pgbench installed on the host.
      - ./data:/repo/data:ro
    healthcheck:
      # -h 127.0.0.1 is not decoration. During first-start initialisation the
      # entrypoint runs a temporary server with listen_addresses='' — reachable
      # on the unix socket but not over TCP. A socket-based pg_isready reports
      # ready while 01-schema.sql is still creating 28 tables, api starts, and
      # the seeder inserts into tables that do not exist yet. Requiring TCP
      # means healthy cannot be true until the init scripts have finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-coupleos}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Magic links (ADR 0007) are printed here rather than sent. Web UI on 1080.
  maildev:
    image: maildev/maildev:2.1.0
    container_name: coupleos-maildev
    ports:
      - "${MAILDEV_UI_PORT:-1080}:1080"
      - "${MAILDEV_SMTP_PORT:-1025}:1025"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:1080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Part of the default stack since M0: the project exists and builds, which is
  # what the `app` profile was previously waiting for. `docker compose up`
  # reaching three healthy containers is M0's exit criterion, and a profile
  # would have left it two.
  api:
    build:
      context: .
      dockerfile: src/CoupleOS.Api/Dockerfile
    container_name: coupleos-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      # Note the app role, not postgres. Connecting as a superuser would
      # silently disable every policy in data/schema.sql.
      ConnectionStrings__Default: >-
        Host=db;Port=5432;Database=${POSTGRES_DB:-coupleos};
        Username=${APP_DB_USER:-app_user};Password=${APP_DB_PASSWORD:-dev_app}
      Smtp__Host: maildev
      Smtp__Port: "1025"
      # ADR 0011: Ollama for development, Anthropic reserved for the
      # validation run. Provider is chosen by config, not by code.
      Llm__Provider: ${LLM_PROVIDER:-ollama}
      Llm__Ollama__BaseUrl: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # Empty by default, which selects the local instance. Setting it points the
      # same provider at Ollama's hosted service (ADR 0013) — inference leaves the
      # laptop, and its stated policy is that prompts are never logged or trained
      # on, which is what makes it the one hosted option ADR 0005/SPEC 40 tolerate.
      Llm__Ollama__ApiKey: ${OLLAMA_API_KEY:-}
      # Llm__Ollama__*, not Llm__Roles__*. ADR 0011 sketched the latter and this
      # file followed it, but OllamaOptions binds Llm:Ollama:FastModel — so for
      # every prior container run these variables set nothing and the model came
      # from appsettings.json. It went unnoticed because that fallback happened
      # to be the value intended, and only surfaced when the fallback was wrong
      # for the configured host (a local model name against ollama.com is a 404).
      Llm__Ollama__FastModel: ${LLM_FAST_MODEL:-qwen3.5:4b}
      Llm__Ollama__DeepModel: ${LLM_DEEP_MODEL:-qwen3.5:4b}
      # Never leave this to Ollama's default — it truncates silently (ADR 0011).
      Llm__Ollama__NumCtx: ${LLM_NUM_CTX:-4096}
      Llm__Ollama__Think: ${LLM_THINK:-false}
      Anthropic__ApiKey: ${ANTHROPIC_API_KEY:-}
      # Matches the volume below and the directory the Dockerfile creates. Stated
      # rather than left to the default so the three cannot drift apart silently
      # — the failure if they do is uploads landing in the container's writable
      # layer and disappearing on the next `up`.
      Attachments__Root: /var/lib/coupleos/attachments
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      # Data protection keys, which ASP.NET writes here and which otherwise die
      # with the container. Antiforgery tokens are encrypted with them, so after
      # `docker compose up --build` every open page POSTs a token the new
      # container cannot decrypt and gets a 400 — including the sign-in form,
      # which makes the app unusable until the browser's cookies are cleared by
      # hand. Observed, repeatedly, while verifying M2 in a browser.
      #
      # A named volume rather than a bind mount: these are secrets, and they
      # belong in Docker's storage rather than in the working tree where a stray
      # `git add -A` could commit them.
      - coupleos-dataprotection:/home/app/.aspnet/DataProtection-Keys

      # Attachment bytes (ADR 0014). A named volume for the same two reasons as
      # the key ring: they must survive `up --build`, and they are the couple's
      # private data — a bind mount would put a receipt for a surprise into the
      # working tree, where a stray `git add -A` could commit it.
      - coupleos-attachments:/var/lib/coupleos/attachments
    depends_on:
      db:
        condition: service_healthy
      maildev:
        condition: service_started
    # Ollama runs on the host, not in the stack — models are large and are
    # better managed by `ollama pull` than by a volume. Docker Desktop provides
    # host.docker.internal; this line adds the same name on native Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  coupleos-pgdata:
  coupleos-dataprotection:
  coupleos-attachments:
